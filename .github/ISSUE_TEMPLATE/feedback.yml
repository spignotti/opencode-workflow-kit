name: Feedback
description: Share what works, what is confusing, or what you would like to see
title: "feedback: "
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Be specific. What helped, what blocked you, and what would improve the kit?
    validations:
      required: true
  - type: checkboxes
    id: expectations
    attributes:
      label: Expectations
      description: This helps me gauge scope.
      options:
        - label: I am reporting an observation or suggestion, not requesting support or new features
          required: false
